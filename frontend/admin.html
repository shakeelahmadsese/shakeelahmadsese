<!doctype html><html><head><meta charset="UTF-8"><title>Admin Panel</title><meta name="robots" content="noindex,nofollow"><style>body{font-family:Arial;padding:1rem}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:8px}</style></head><body><h1>Admin Panel</h1><p>Use admin login first from main page (admin@kidscorner.com / Admin@123)</p><button onclick="loadOrders()">Load Orders</button><table id="tbl"><tr><th>ID</th><th>Total</th><th>Method</th><th>Status</th><th>Date</th></tr></table><script>async function loadOrders(){const token=localStorage.getItem('token');const r=await fetch('http://localhost:4000/api/admin/orders',{headers:{Authorization:'Bearer '+token}});const d=await r.json();const t=document.getElementById('tbl');d.forEach(o=>{t.innerHTML+=`<tr><td>${o.id}</td><td>${o.total}</td><td>${o.payment_method}</td><td>${o.payment_status}</td><td>${o.created_at}</td></tr>`})}</script></body></html>
